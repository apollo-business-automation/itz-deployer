apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cp4ba-cloud-pak-deployer-demos-run-
spec:
  timeouts:
    pipeline: 9h0m0s
  pipelineRef:
    name: cp4ba-cloud-pak-deployer-demos
  params:
    - name: cloud-pak-deployer-image-build
      value: "false"
    - name: cloud-pak-deployer-image-build-repo
      value: "https://github.com/IBM/cloud-pak-deployer"
    - name: cloud-pak-deployer-image-build-repo-ref
      value: "main"
    - name: cloud-pak-deployer-image-address
      value: "quay.io/cloud-pak-deployer/cloud-pak-deployer"
    - name: cloud-pak-deployer-image-tag
      value: "latest"
    - name: storage-class
      value: "ocs-storagecluster-cephfs"
    - name: co-deploy
      value: "true"
    - name: co-generated-users-password
      value: "-generated-"
    - name: da-deploy
      value: "true"
    - name: cm-deploy
      value: "true"
    - name: ads-genai-api-key
      value: "watsonx_ai_api_key"
    - name: ads-genai-ml-url
      value: "https://us-south.ml.cloud.ibm.com"
    - name: ads-genai-project-id
      value: "project_id"
    - name: baw-genai-api-key
      value: "watsonx_ai_api_key"
    - name: baw-genai-ml-url
      value: "https://us-south.ml.cloud.ibm.com"
    - name: baw-genai-project-id
      value: "project_id"
    - name: baw-genai-default-foundation-model
      value: "meta-llama/llama-3-3-70b-instruct"
